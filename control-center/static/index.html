<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3WG Control Center</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8edf5;background:#07090b}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid #242a31;padding:22px 16px;background:#0b0e11}.brand{font-size:24px;font-weight:850;color:#fff}.brand b{color:#b7e421}.sub,.muted{color:#8290a3;font-size:12px}.nav{margin-top:35px;display:grid;gap:6px}.nav span{padding:10px;border-left:2px solid #9ac200;background:#141a0b;color:#d8f47b}.main{padding:24px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:27px}.actions{display:flex;gap:8px}.btn{border:1px solid #3b4652;background:#12171c;color:#e8edf5;border-radius:6px;padding:9px 13px;cursor:pointer}.btn.primary{background:#ff8c00;border-color:#ff8c00;color:#17100a;font-weight:750}.btn.danger{color:#ff8c73}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin:20px 0}.stat,.panel,.node{border:1px solid #26303a;background:#0e1216;border-radius:8px}.stat{padding:16px}.stat b{display:block;font-size:25px;color:#b7e421}.stat span{font-size:11px;color:#8390a0;text-transform:uppercase}.panel{padding:16px;margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;gap:8px}.form input{min-width:0;border:1px solid #34404c;background:#080b0e;color:#fff;border-radius:6px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.node{padding:16px;position:relative;overflow:hidden}.node.online:after{content:"";position:absolute;width:130px;height:130px;right:-70px;top:-70px;background:#a9dd001a;filter:blur(12px)}.node-head{display:flex;justify-content:space-between;gap:12px}.node h3{margin:0 0 4px}.badge{border:1px solid #4d6511;color:#b7e421;background:#172000;padding:4px 7px;border-radius:5px;font-size:10px;font-weight:800}.badge.bad{border-color:#7b392e;color:#ff8c73;background:#25100d}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.meta span{border:1px solid #2d3741;border-radius:4px;padding:4px 6px;color:#aeb8c4;font-size:11px}.protocols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.proto{border-top:1px solid #26303a;padding-top:10px}.proto b{display:block}.proto small{color:#7f8c9d}.node-actions{display:flex;justify-content:space-between;margin-top:16px}.error{color:#ff8c73;font-size:12px;margin-top:10px;overflow-wrap:anywhere}.empty{text-align:center;padding:50px;color:#8390a0}.login{max-width:390px;margin:18vh auto;padding:24px}.login input{display:block;width:100%;margin:10px 0}.hidden{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:14px}.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top h1{font-size:22px}}
</style></head><body>
<div id="login" class="panel login hidden"><div class="brand"><b>3WG</b> Control Center</div><p class="muted">Центральное управление VPN-нодами</p><input id="loginUser" placeholder="Логин" value="admin"><input id="loginPass" type="password" placeholder="Пароль"><button class="btn primary" onclick="doLogin()">Войти</button><p id="loginError" class="error"></p></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><b>3WG</b> Control</div><div class="sub">Management Center</div><div class="nav"><span>Серверы</span></div></aside><main class="main"><header class="top"><div><h1>Центр управления</h1><div class="muted">3WG Core и 3WG Easy Core</div></div><div class="actions"><button class="btn" onclick="syncAll()">Обновить все</button><button class="btn" onclick="logout()">Выйти</button></div></header>
<section class="stats"><div class="stat"><b id="sNodes">0</b><span>Серверов</span></div><div class="stat"><b id="sOnline">0</b><span>В сети</span></div><div class="stat"><b id="sProtocols">0</b><span>Протоколов</span></div><div class="stat"><b id="sPeers">0</b><span>Пиров</span></div></section>
<section class="panel"><form class="form" onsubmit="addNode(event)"><input id="name" placeholder="Название ноды" required><input id="url" type="url" placeholder="https://vpn.example.com" required><input id="key" type="password" placeholder="Node API Key" required><input id="region" placeholder="Страна / город"><input id="tags" placeholder="Теги через запятую"><button class="btn primary">Добавить</button></form><div id="formError" class="error"></div></section>
<section id="nodes" class="grid"></section></main></div>
<script>
const $=id=>document.getElementById(id),loginEl=$('login'),appEl=$('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.detail||`HTTP ${r.status}`);e.status=r.status;throw e}return d}
async function load(){try{const d=await api('/api/state');showApp();render(d)}catch(e){if(e.status===401)showLogin();else{showApp();$('nodes').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
function showLogin(){loginEl.classList.remove('hidden');appEl.classList.add('hidden')}function showApp(){loginEl.classList.add('hidden');appEl.classList.remove('hidden')}
async function doLogin(){$('loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginPass').value='';load()}catch(e){$('loginError').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});showLogin()}
function render(d){$('sNodes').textContent=d.summary.nodes;$('sOnline').textContent=d.summary.online;$('sProtocols').textContent=d.summary.protocols;$('sPeers').textContent=d.summary.peers;$('nodes').innerHTML=d.nodes.length?d.nodes.map(nodeHtml).join(''):'<div class="panel empty">Добавьте первую 3WG-ноду</div>'}
function nodeHtml(n){const s=n.snapshot||{},online=n.last_ok_at&&!n.last_error,protos=s.protocols||[],peers=s.peers||[];return `<article class="node ${online?'online':''}"><div class="node-head"><div><h3>${esc(n.name)}</h3><a class="muted" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a></div><span class="badge ${online?'':'bad'}">${online?'ONLINE':'ERROR'}</span></div><div class="meta"><span>${esc((s.edition||'—').toUpperCase())}</span><span>${esc(s.version||'—')}</span>${n.region?`<span>${esc(n.region)}</span>`:''}<span>${peers.length} пиров</span></div><div class="protocols">${protos.map(p=>`<div class="proto"><b>${esc(p.title)}</b><small>${p.available?'доступен':'недоступен'} · ${esc(p.port||'—')}/udp</small></div>`).join('')||'<span class="muted">Нет данных</span>'}</div>${n.last_error?`<div class="error">${esc(n.last_error)}</div>`:''}<div class="node-actions"><button class="btn" onclick="syncNode(${n.id})">Обновить</button><button class="btn danger" onclick="removeNode(${n.id})">Удалить</button></div></article>`}
async function addNode(e){e.preventDefault();$('formError').textContent='';try{await api('/api/nodes',{method:'POST',body:JSON.stringify({name:$('name').value,url:$('url').value,api_key:$('key').value,region:$('region').value,tags:$('tags').value})});e.target.reset();load()}catch(x){$('formError').textContent=x.message}}
async function syncNode(id){await api(`/api/nodes/${id}/sync`,{method:'POST'});load()}async function syncAll(){await api('/api/sync',{method:'POST'});load()}async function removeNode(id){if(confirm('Удалить эту ноду из центра?')){await api(`/api/nodes/${id}`,{method:'DELETE'});load()}}
load();
</script></body></html>
