:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8edf5;background:#07090b}*{box-sizing:border-box}body{margin:0;background:#07090b}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid #242a31;padding:16px 0;background:#0b0e11}.logo{display:block;width:190px;height:82px;object-fit:contain;margin:0 auto 8px}.brand{padding:0 18px;font-size:21px;font-weight:850;color:#fff}.brand b{color:#b7e421}.sub,.muted{color:#8290a3;font-size:12px}.sub{padding:2px 18px}.nav{margin-top:28px;display:grid}.nav button{border:0;border-left:2px solid transparent;background:transparent;color:#aeb8c4;padding:12px 18px;text-align:left;cursor:pointer}.nav button.active{border-color:#9ac200;background:#141a0b;color:#d8f47b}.main{padding:20px 24px;max-width:1800px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:27px}.actions{display:flex;gap:8px}.btn{border:1px solid #3b4652;background:#12171c;color:#e8edf5;border-radius:6px;padding:9px 13px;cursor:pointer}.btn.primary{background:#ff8c00;border-color:#ff8c00;color:#17100a;font-weight:750}.btn.danger{color:#ff8c73}.btn.small{padding:6px 8px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin:18px 0}.stat,.panel,.node{border:1px solid #26303a;background:#0e1216;border-radius:8px}.stat{padding:16px}.stat b{display:block;font-size:25px;color:#b7e421}.stat span{font-size:11px;color:#8390a0;text-transform:uppercase}.panel{padding:16px;margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;gap:8px}.form input,.form select,.toolbar input,.toolbar select{min-width:0;border:1px solid #34404c;background:#080b0e;color:#fff;border-radius:6px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.node{padding:16px;position:relative;overflow:hidden}.node.online:after{content:"" :root{color:#131d2e;background:#edf3fc;font-family:"IBM Plex Mono","Roboto Mono",ui-monospace,monospace}body{background:#edf3fc;color:#131d2e}.shell{grid-template-columns:166px minmax(0,1fr)}.side{padding:0;background:#f8fafc;border-color:#ced9e8}.logo{width:164px;height:76px;margin:0;object-fit:contain}.brand{display:none}.sub{padding:10px 12px;border-top:1px dashed #cbd7e5;color:#6e819a;font-size:9px;text-transform:uppercase}.nav{margin-top:8px}.nav button{padding:10px 12px;color:#52677f;border-left-width:0;border-right:2px solid transparent;font-size:12px}.nav button.active{color:#628600;background:#e8f0dc;border-right-color:#87b800}.main{padding:10px 18px;background:#edf3fc}.top h1{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:25px;color:#111a2b}.top .muted{color:#71839a}.btn{background:#fff;color:#26374d;border-color:#c9d6e6;border-radius:6px;padding:7px 10px;font-size:11px}.btn.primary{background:#ff8c00;border-color:#ff8c00;color:#152033}.btn.danger{color:#df5363;border-color:#ffc2c8;background:#fff5f6}.stats{gap:8px;margin:10px 0 12px}.stat,.panel,.node{background:#fff;border-color:#d2ddec;border-radius:7px}.stat{min-height:58px;padding:10px 12px;position:relative;overflow:hidden}.stat:after,.node.online:after{content:"";position:absolute;width:110px;height:110px;right:-55px;top:-62px;background:#c8ff4b33;filter:blur(15px)}.stat b{font-size:18px;color:#6b9800}.stat span{color:#71839a;font-size:9px}.panel{padding:12px;margin-bottom:10px}.form{gap:6px}.form input,.form select,.toolbar input,.toolbar select{height:34px;background:#fff;color:#26374d;border-color:#c8d6e7;border-radius:6px;padding:7px 9px;font-size:11px}.checks{color:#52677f;font-size:11px}.grid{gap:10px}.node{padding:12px}.node h3{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;color:#172235}.node a.muted{color:#58708e}.badge{background:#f3f8e8;border-color:#c5d99a;color:#648600}.badge.bad{background:#fff1f2;border-color:#fda4af;color:#be123c}.badge.awg{background:#ecfeff;border-color:#67e8f9;color:#0e7490}.meta{margin:10px 0}.meta span{border-color:#d3dfed;color:#647991;background:#f8fafc}.protocols{gap:8px}.proto{border-color:#dce5f0}.proto b{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:12px}.proto small{color:#70839a}.node-actions{margin-top:11px}.toolbar{gap:6px;margin-bottom:8px}.table-wrap{border-color:#d2ddec;background:#fff}table{background:#fff;color:#26374d;font-size:10px}th,td{padding:7px 8px;border-color:#e1e8f1}th{color:#71839a;font-size:8px}td strong{color:#172235}.empty{color:#71839a}.login{box-shadow:0 18px 60px #5f78902e}.login .brand{display:block;padding:0;color:#172235}.error{color:#c2410c}@media(max-width:900px){.shell{grid-template-columns:1fr}.main{padding:10px}}

<style>
.hidden{display:none!important}.control-nav{display:grid;gap:2px}.control-nav .nav{cursor:pointer;text-align:left}.control-form{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;gap:8px}.control-form input,.control-form select,.control-toolbar input,.control-toolbar select{height:38px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:0 12px}.control-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}.control-node{position:relative;overflow:hidden}.control-node.online:after,.stat-card:after{content:"";position:absolute;width:120px;height:120px;right:-60px;top:-65px;background:var(--corner-glow);filter:blur(14px);pointer-events:none}.node-head,.node-actions{display:flex;justify-content:space-between;gap:12px}.node-head h3{margin:0 0 5px}.node-link{color:var(--muted);font-size:12px}.meta,.protocols,.peer-actions{display:flex;gap:7px;flex-wrap:wrap}.meta{margin:14px 0}.meta span{border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--muted);font-size:11px}.protocols{border-top:1px solid var(--line);padding-top:12px}.proto{flex:1;min-width:130px}.proto b,.proto small{display:block}.proto small{color:var(--muted);margin-top:4px}.node-actions{margin-top:16px}.control-toolbar{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;margin-bottom:10px}.table-wrap{overflow:auto}.control-table{min-width:1050px}.control-button{height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--text);padding:0 11px;text-decoration:none;cursor:pointer;font-weight:700}.control-button.danger{color:#be123c;border-color:#fecdd3}.control-button.small{height:29px;padding:0 8px;font-size:11px}.error{color:#c2410c;font-size:12px;margin-top:10px;overflow-wrap:anywhere}.empty{text-align:center;padding:42px;color:var(--muted)}@media(max-width:900px){.control-form,.control-toolbar{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.control-grid{grid-template-columns:1fr}}
.control-node.online:after,.stat-card:after{content:none}.control-table{min-width:1540px}.control-table .server-col{width:120px}.control-table .id-col{width:46px}.control-table .name-col{width:150px}.control-table .owner-col{width:78px}.control-table .category-col{width:118px}.control-table .proto-col{width:96px}.control-table .ip-col{width:100px}.control-table .status-col{width:80px}.control-table .policy-col{width:190px}.control-table .network-col{width:180px}.control-table .traffic-col{width:105px}.control-table .actions-col{width:130px}.policy-summary{display:grid;gap:4px}.policy-summary small{display:flex;gap:7px}.owner-badge{display:inline-flex}.peer-actions.actions{gap:3px}.peer-actions .icon-button{font-family:inherit}
.clients-table .proto{min-width:0;flex:none}
.control-nav{margin-top:0}.control-nav .nav svg{width:18px;height:18px}.management-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:10px}.management-card h3{margin:0}.management-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.management-body{display:grid;gap:8px;margin-top:14px}.management-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}.management-row span{color:var(--muted)}.management-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
</style></head><body>
<div id="login" class="login-page hidden"><div class="login-card"><span class="badge">3WG CONTROL</span><img class="login-logo" src="/logo.png" alt="3WG"><p class="login-subtitle">Центральное управление VPN-нодами</p><label for="loginUser">Логин</label><input id="loginUser" value="admin"><label for="loginPass">Пароль</label><input id="loginPass" type="password"><button onclick="doLogin()">Войти</button><p id="loginError" class="login-error hidden"></p></div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="brand-block"><img src="/logo.png" alt="3WG"></div><div class="nav-title">ОБЗОР</div><div class="control-nav"><button id="navHome" class="nav active" data-icon="home" onclick="showView('servers')"><span>Главная</span></button><button id="navServers" class="nav" data-icon="server" onclick="showManage('status','Серверы')"><span>Серверы</span></button><button id="navPeers" class="nav" data-icon="users" onclick="showView('peers')"><span>Все пиры</span></button></div><div class="nav-title">УПРАВЛЕНИЕ</div><div class="control-nav"><button class="nav manage-nav" data-section="users" data-icon="users" onclick="showManage('users','Пользователи')"><span>Пользователи</span></button><button class="nav manage-nav" data-section="monitoring" data-icon="activity" onclick="showManage('monitoring','Мониторинг')"><span>Мониторинг</span></button><button class="nav manage-nav" data-section="p2p" data-icon="shield" onclick="showManage('p2p','P2P Guard')"><span>P2P Guard</span></button><button class="nav manage-nav" data-section="updates" data-icon="refresh" onclick="showManage('updates','Обновления')"><span>Обновления</span></button><button class="nav manage-nav" data-section="audit" data-icon="terminal" onclick="showManage('audit','Audit log')"><span>Audit log</span></button><button class="nav manage-nav" data-section="backups" data-icon="backup" onclick="showManage('backups','Backups')"><span>Backups</span></button><button class="nav manage-nav" data-section="migration" data-icon="send" onclick="showManage('migration','Migration')"><span>Migration</span></button></div><div class="nav-title">ИНСТРУМЕНТЫ</div><div class="control-nav"><button class="nav manage-nav" data-section="diagnostics" data-icon="activity" onclick="showManage('diagnostics','Диагностика')"><span>Диагностика</span></button><button class="nav logout" data-icon="logout" onclick="logout()"><span>Выход</span></button></div></aside><main class="main"><header class="topbar"><div><h1 id="pageTitle">Центр управления</h1><p id="pageSubtitle">3WG Core и 3WG Easy Core</p></div><div class="top-actions"><button onclick="refreshCurrent()">Обновить все</button><button onclick="logout()">Выйти</button></div></header>
<section class="stats-grid"><div class="stat-card"><div class="stat-value" id="sNodes">0</div><div class="stat-label">серверов</div></div><div class="stat-card"><div class="stat-value" id="sOnline">0</div><div class="stat-label">в сети</div></div><div class="stat-card"><div class="stat-value" id="sProtocols">0</div><div class="stat-label">протоколов</div></div><div class="stat-card"><div class="stat-value" id="sPeers">0</div><div class="stat-label">пиров</div></div></section>
<div id="serversView"><section class="card"><form class="control-form" onsubmit="addNode(event)" autocomplete="off"><input id="name" name="node_display_name" placeholder="Название ноды" autocomplete="off" required><input id="url" name="node_public_url" type="url" placeholder="https://vpn.example.com" autocomplete="off" required><input id="key" name="node_api_token" type="password" placeholder="Node API Key" autocomplete="new-password" required><input id="region" name="node_region" placeholder="Страна / город" autocomplete="off"><input id="tags" name="node_tags" placeholder="Теги через запятую" autocomplete="off"><button class="orange-btn small">Добавить</button></form><div id="formError" class="error"></div></section><section id="nodes" class="control-grid"></section></div>
<div id="peersView" class="hidden"><section class="card"><form class="control-form" onsubmit="createPeer(event)"><select id="peerNode" required></select><input id="peerName" placeholder="Имя клиента" required><div class="checks"><label><input id="peerWg" type="checkbox" checked> WireGuard</label><label><input id="peerAwg" type="checkbox" checked> AmneziaWG</label></div><select id="peerExpires"><option value="">Без срока</option><option value="30">30 дней</option><option value="180">Полгода</option><option value="365">1 год</option></select><input id="peerTraffic" type="number" min="0" placeholder="Лимит GiB"><button class="orange-btn small">Создать</button></form><div id="peerError" class="error"></div></section><div class="control-toolbar"><input id="peerSearch" placeholder="Поиск по имени, IP или серверу" oninput="renderPeers()"><select id="peerFilterNode" onchange="renderPeers()"><option value="">Все серверы</option></select><button class="control-button" onclick="renderPeers()">Обновить список</button></div><div class="card table-wrap"><table class="clients-table control-table"><colgroup><col class="server-col"><col class="id-col"><col class="name-col"><col class="owner-col"><col class="category-col"><col class="proto-col"><col class="ip-col"><col class="status-col"><col class="policy-col"><col class="network-col"><col class="traffic-col"><col class="actions-col"></colgroup><thead><tr><th>Сервер</th><th>ID</th><th>Имя пользователя</th><th>Создал</th><th>Категория</th><th>Протокол</th><th>Внутренний IP</th><th>Статус</th><th>Ограничения</th><th>Сеть</th><th>Трафик</th><th>Actions</th></tr></thead><tbody id="peersBody"></tbody></table></div></div><div id="managementView" class="hidden"><section id="managementGrid" class="management-grid"></section></div></main></div>
<script>
const $=id=>document.getElementById(id),loginEl=$('login'),appEl=$('app');
let stateData={nodes:[],summary:{nodes:0,online:0,protocols:0,peers:0}},currentView={type:'servers'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.detail||`HTTP ${r.status}`);e.status=r.status;throw e}return d}
async function load(){try{const d=await api('/api/state');showApp();render(d)}catch(e){if(e.status===401)showLogin();else{showApp();$('nodes').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
function showLogin(){loginEl.classList.remove('hidden');appEl.classList.add('hidden')}function showApp(){loginEl.classList.add('hidden');appEl.classList.remove('hidden')}
async function doLogin(){$('loginError').textContent='';$('loginError').classList.add('hidden');try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginPass').value='';load()}catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden')}}
async function logout(){await api('/api/logout',{method:'POST'});showLogin()}
function render(d){stateData=d;$('sNodes').textContent=d.summary.nodes;$('sOnline').textContent=d.summary.online;$('sProtocols').textContent=d.summary.protocols;$('sPeers').textContent=d.summary.peers;$('nodes').innerHTML=d.nodes.length?d.nodes.map(nodeHtml).join(''):'<div class="card empty">Добавьте первую 3WG-ноду</div>';const options=d.nodes.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('');$('peerNode').innerHTML=options;$('peerFilterNode').innerHTML='<option value="">Все серверы</option>'+options;renderPeers()}
function clearNav(){document.querySelectorAll('.sidebar .nav').forEach(x=>x.classList.remove('active'))}
function showView(view){currentView={type:view};const peers=view==='peers';$('serversView').classList.toggle('hidden',peers);$('peersView').classList.toggle('hidden',!peers);$('managementView').classList.add('hidden');clearNav();$(peers?'navPeers':'navHome').classList.add('active');$('pageTitle').textContent=peers?'Все пиры':'Центр управления';$('pageSubtitle').textContent=peers?'Клиенты на всех подключённых нодах':'3WG Core и 3WG Easy Core'}
async function showManage(section,title){currentView={type:'manage',section,title};$('serversView').classList.add('hidden');$('peersView').classList.add('hidden');$('managementView').classList.remove('hidden');clearNav();const nav=section==='status'?$('navServers'):document.querySelector(`[data-section="${section}"]`);if(nav)nav.classList.add('active');$('pageTitle').textContent=title;$('pageSubtitle').textContent='Централизованное управление всеми нодами';$('managementGrid').innerHTML='<div class="card empty">Загрузка данных...</div>';const cards=await Promise.all(stateData.nodes.map(async n=>{try{return managementCard(n,section,await api(`/api/nodes/${n.id}/manage/${section}`))}catch(e){return managementCard(n,section,null,e.message)}}));$('managementGrid').innerHTML=cards.join('')||'<div class="card empty">Нет подключённых серверов</div>'}
function refreshCurrent(){if(currentView.type==='manage')showManage(currentView.section,currentView.title);else if(currentView.type==='peers')load().then(()=>showView('peers'));else syncAll()}
function managementRows(section,d){if(!d)return[];if(section==='status')return[['Клиентов',d.clients_total],['Пиров online',`${d.peers_online||0} / ${d.peers_total||0}`],['Endpoint',d.endpoint_host||'—']];if(section==='users')return[['Пользователей',(d.users||[]).length],['Учётные записи',(d.users||[]).slice(0,4).map(x=>x.username).join(', ')||'—']];if(section==='p2p')return[['Состояние',d.settings&&d.settings.enabled?'ENABLED':'DISABLED'],['Режим',d.settings&&d.settings.mode||'—'],['UDP allow',d.settings&&d.settings.allow_udp_ports||'—']];if(section==='updates')return[['Текущая версия',d.current||d.current_version||'—'],['Доступная версия',d.latest||d.latest_version||'—'],['Updater',d.runner&&d.runner.can_run?'READY':d.job&&d.job.running?'RUNNING':'—']];if(section==='backups')return[['Архивов',(d.backups||[]).length],['Последний',d.backups&&d.backups[0]&&d.backups[0].name||'—'],['Автокопирование',d.auto&&d.auto.enabled?'Включено':'Выключено']];if(section==='audit')return[['Событий',(d.events||[]).length],['Последнее действие',d.events&&d.events[0]&&d.events[0].action||'—'],['Исполнитель',d.events&&d.events[0]&&d.events[0].actor_username||'—']];if(section==='migration')return[['Пакетов',(d.bundles||[]).length],['Последний',d.bundles&&d.bundles[0]&&d.bundles[0].name||'—'],['Push runner',d.runner&&d.runner.can_run?'READY':'—']];if(section==='monitoring')return[['Prometheus',d.enabled?'Включён':'Выключен'],['Endpoint',d.metrics_url||'/metrics'],['Токен',d.token_configured?'Настроен':'Не настроен']];if(section==='diagnostics')return[['Состояние',d.ok===false?'Есть ошибки':'Проверено'],['Проверок',Object.keys(d.checks||d).length],['Время',new Date().toLocaleTimeString('ru-RU')]];return[]}
function sectionPath(section){return({status:'/',users:'/users',monitoring:'/monitoring',p2p:'/abuse',updates:'/updates',audit:'/audit',backups:'/backups',migration:'/migration',diagnostics:'/tools/health'})[section]||'/'}
function managementCard(n,section,d,error=''){const rows=managementRows(section,d);let actions=`<a class="control-button" href="${esc(n.url+sectionPath(section))}" target="_blank" rel="noopener">Открыть на ноде</a>`;if(section==='backups')actions+=`<button class="orange-btn small" onclick="manageAction(${n.id},'backup-create')">Создать backup</button>`;if(section==='p2p')actions+=`<button class="orange-btn small" onclick="manageAction(${n.id},'p2p-apply')">Применить правила</button>`;if(section==='updates')actions+=`<button class="orange-btn small" onclick="runNodeUpdate(${n.id},${JSON.stringify((d&&d.runner&&d.runner.confirm_text)||'UPDATE')})">Обновить ноду</button>`;return `<article class="card management-card"><div class="management-head"><div><h3>${esc(n.name)}</h3><a class="node-link" href="${esc(n.url)}" target="_blank">${esc(n.url)}</a></div><span class="status-pill ${error?'offline':'online'}">${error?'ERROR':'ONLINE'}</span></div>${error?`<div class="error">${esc(error)}</div>`:`<div class="management-body">${rows.map(x=>`<div class="management-row"><span>${esc(x[0])}</span><b>${esc(x[1]??'—')}</b></div>`).join('')}</div>`}<div class="management-actions">${actions}</div></article>`}
async function manageAction(node,action,payload={}){try{await api(`/api/nodes/${node}/manage/action/${action}`,{method:'POST',body:JSON.stringify(payload)});await refreshCurrent()}catch(e){alert(e.message)}}
async function runNodeUpdate(node,confirmText){if(!confirm(`Запустить обновление этой ноды? Будет создан backup.`))return;await manageAction(node,'update-run',{confirm:confirmText})}
function nodeHtml(n){const s=n.snapshot||{},online=n.last_ok_at&&!n.last_error,protos=s.protocols||[],peers=s.peers||[];return `<article class="card control-node ${online?'online':''}"><div class="node-head"><div><h3>${esc(n.name)}</h3><a class="node-link" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a></div><span class="status-pill ${online?'online':'offline'}">${online?'ONLINE':'ERROR'}</span></div><div class="meta"><span>${esc((s.edition||'—').toUpperCase())}</span><span>${esc(s.version||'—')}</span>${n.region?`<span>${esc(n.region)}</span>`:''}<span>${peers.length} пиров</span></div><div class="protocols">${protos.map(p=>`<div class="proto ${String(p.id||p.title||'').toLowerCase().includes('wireguard')&&!String(p.id||p.title||'').toLowerCase().includes('amnezia')?'proto-wireguard':''}"><b>${esc(p.title)}</b><small>${p.available?'доступен':'недоступен'} · ${esc(p.port||'—')}/udp</small></div>`).join('')||'<span class="muted">Нет данных</span>'}</div>${n.last_error?`<div class="error">${esc(n.last_error)}</div>`:''}<div class="node-actions"><button class="control-button" onclick="syncNode(${n.id})">Обновить</button><button class="control-button danger" onclick="removeNode(${n.id})">Удалить</button></div></article>`}
async function addNode(e){e.preventDefault();$('formError').textContent='';try{await api('/api/nodes',{method:'POST',body:JSON.stringify({name:$('name').value,url:$('url').value,api_key:$('key').value,region:$('region').value,tags:$('tags').value})});e.target.reset();load()}catch(x){$('formError').textContent=x.message}}
async function syncNode(id){await api(`/api/nodes/${id}/sync`,{method:'POST'});load()}async function syncAll(){await api('/api/sync',{method:'POST'});load()}async function removeNode(id){if(confirm('Удалить эту ноду из центра?')){await api(`/api/nodes/${id}`,{method:'DELETE'});load()}}
function bytes(v){v=Number(v||0);if(v<1024)return `${v} B`;const u=['KiB','MiB','GiB','TiB'];let i=-1;do{v/=1024;i++}while(v>=1024&&i<u.length-1);return `${v.toFixed(v>=10?1:2)} ${u[i]}`}
function dateTime(v){return v&&v!=='0'?new Date(Number(v)*1000).toLocaleString('ru-RU'):'-'}
function icon(name){const paths={download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',qr:'<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',trash:'<path d="M3 6h18"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M19 6l-1 14c0 1-1 2-2 2H8c-1 0-2-1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>'};return `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`}
function decorateNav(){const paths={home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',server:'<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',shield:'<path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/>',refresh:'<path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/>',terminal:'<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',backup:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>'};document.querySelectorAll('[data-icon]').forEach(el=>{el.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[el.dataset.icon]||''}</svg>`)})}
function allPeers(){return stateData.nodes.flatMap(n=>(n.snapshot.peers||[]).map(p=>({...p,nodeId:n.id,nodeName:n.name})))}
function renderPeers(){if(!$('peersBody'))return;const q=$('peerSearch').value.toLowerCase(),node=$('peerFilterNode').value;const peers=allPeers().filter(p=>(!node||String(p.nodeId)===node)&&(!q||`${p.name} ${p.ip_cidr} ${p.nodeName}`.toLowerCase().includes(q)));$('peersBody').innerHTML=peers.map(p=>`<tr class="clickable-row"><td>${esc(p.nodeName)}</td><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td><span class="owner-badge">${esc(p.created_by_label||p.owner_username||'admin')}</span></td><td>${esc(p.category_name||'Без категории')}</td><td><span class="proto ${p.protocol==='wireguard'?'proto-wireguard':''}">${esc(p.protocol_title||p.protocol)}</span></td><td><code>${esc(p.ip_cidr)}</code></td><td><span class="${p.status==='active'?'active-text':'blocked-text'}">${esc((p.ui&&p.ui.status_label)||p.status||'OFFLINE')}</span></td><td><div class="policy-summary"><span class="limit-bar ${p.traffic_limit&&p.traffic_limit.exceeded?'exceeded':''}"><i style="width:${p.traffic_limit&&p.traffic_limit.enabled?Math.max(4,p.traffic_limit.percent||0):0}%"></i></span><small><span>${esc((p.expiration&&p.expiration.label)||'без срока')}</span><span>${esc((p.traffic_limit&&p.traffic_limit.label)||'без лимита')}</span></small></div></td><td><div class="network-cell"><b>${esc((p.live&&p.live.endpoint)||'(none)')}</b><small>${dateTime(p.live&&p.live.latest_handshake)}</small></div></td><td><div class="traffic-cell"><span><b>RX</b> ${bytes(p.live&&p.live.rx)}</span><span><b>TX</b> ${bytes(p.live&&p.live.tx)}</span></div></td><td class="actions-cell"><div class="peer-actions actions"><a class="icon-button download" title="Скачать .conf" href="/api/nodes/${p.nodeId}/peers/${p.id}/download/conf">${icon('download')}</a>${p.protocol==='amneziawg'?`<a class="icon-button download-vpn" title="Скачать .vpn" href="/api/nodes/${p.nodeId}/peers/${p.id}/download/vpn">${icon('download')}</a>`:''}<a class="icon-button qr" title="Скачать QR" href="/api/nodes/${p.nodeId}/peers/${p.id}/download/qr">${icon('qr')}</a><button class="icon-button ${p.enabled?'block':'enable'}" title="${p.enabled?'Отключить':'Включить'}" onclick="peerAction(${p.nodeId},${p.id},'${p.enabled?'disable':'enable'}')">${icon('power')}</button><button class="icon-button reset" title="Сбросить трафик" onclick="peerAction(${p.nodeId},${p.id},'traffic-reset')">${icon('reset')}</button><button class="icon-button danger" title="Удалить" onclick="deletePeer(${p.nodeId},${p.id})">${icon('trash')}</button></div></td></tr>`).join('')||'<tr><td colspan="12" class="empty-table">Пиры не найдены</td></tr>'}
async function createPeer(e){e.preventDefault();$('peerError').textContent='';const protocols=[];if($('peerWg').checked)protocols.push('wireguard');if($('peerAwg').checked)protocols.push('amneziawg');if(!protocols.length){$('peerError').textContent='Выберите хотя бы один протокол';return}const days=Number($('peerExpires').value||0),gib=Number($('peerTraffic').value||0);try{await api(`/api/nodes/${$('peerNode').value}/peers`,{method:'POST',body:JSON.stringify({name:$('peerName').value,protocols,expires_at:days?Math.floor(Date.now()/1000)+days*86400:null,traffic_limit_bytes:gib?gib*1073741824:0})});$('peerName').value='';await load();showView('peers')}catch(x){$('peerError').textContent=x.message}}
async function peerAction(node,id,action){try{await api(`/api/nodes/${node}/peers/${id}/${action}`,{method:'POST'});load()}catch(e){alert(e.message)}}async function deletePeer(node,id){if(!confirm('Удалить этот пир без возможности восстановления?'))return;try{await api(`/api/nodes/${node}/peers/${id}`,{method:'DELETE'});load()}catch(e){alert(e.message)}}
function prepareGroups(){document.querySelectorAll('.sidebar>.nav-title').forEach(title=>{const label=title.textContent.trim();if(!['УПРАВЛЕНИЕ','ИНСТРУМЕНТЫ'].includes(label))return;const group=title.nextElementSibling;if(!group)return;const button=document.createElement('button');button.type='button';button.className='nav-title nav-title-toggle open';button.innerHTML=`<span>${label}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>`;button.onclick=()=>{const open=group.classList.toggle('hidden')===false;button.classList.toggle('open',open)};title.replaceWith(button)})}
prepareGroups();decorateNav();load();
</script></body></html>
