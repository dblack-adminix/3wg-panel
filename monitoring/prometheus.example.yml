global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 3wg-panel
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: CHANGE_ME_METRICS_TOKEN
    static_configs:
      - targets:
          - cz-prg-01.nodax.eu:18080
        labels:
          node: cz-prg-01
          role: vpn-node

  - job_name: node-exporter
    static_configs:
      - targets:
          - cz-prg-01.nodax.eu:9100
        labels:
          node: cz-prg-01
          role: vpn-node

  - job_name: cadvisor
    static_configs:
      - targets:
          - cz-prg-01.nodax.eu:8080
        labels:
          node: cz-prg-01
          role: vpn-node
