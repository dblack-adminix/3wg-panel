<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3WG Control Center</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8edf5;background:#07090b}*{box-sizing:border-box}body{margin:0;background:#07090b}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid #242a31;padding:16px 0;background:#0b0e11}.logo{display:block;width:190px;height:82px;object-fit:contain;margin:0 auto 8px}.brand{padding:0 18px;font-size:21px;font-weight:850;color:#fff}.brand b{color:#b7e421}.sub,.muted{color:#8290a3;font-size:12px}.sub{padding:2px 18px}.nav{margin-top:28px;display:grid}.nav button{border:0;border-left:2px solid transparent;background:transparent;color:#aeb8c4;padding:12px 18px;text-align:left;cursor:pointer}.nav button.active{border-color:#9ac200;background:#141a0b;color:#d8f47b}.main{padding:20px 24px;max-width:1800px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:27px}.actions{display:flex;gap:8px}.btn{border:1px solid #3b4652;background:#12171c;color:#e8edf5;border-radius:6px;padding:9px 13px;cursor:pointer}.btn.primary{background:#ff8c00;border-color:#ff8c00;color:#17100a;font-weight:750}.btn.danger{color:#ff8c73}.btn.small{padding:6px 8px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin:18px 0}.stat,.panel,.node{border:1px solid #26303a;background:#0e1216;border-radius:8px}.stat{padding:16px}.stat b{display:block;font-size:25px;color:#b7e421}.stat span{font-size:11px;color:#8390a0;text-transform:uppercase}.panel{padding:16px;margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;gap:8px}.form input,.form select,.toolbar input,.toolbar select{min-width:0;border:1px solid #34404c;background:#080b0e;color:#fff;border-radius:6px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.node{padding:16px;position:relative;overflow:hidden}.node.online:after{content:"";position:absolute;width:130px;height:130px;right:-70px;top:-70px;background:#a9dd001a;filter:blur(12px)}.node-head{display:flex;justify-content:space-between;gap:12px}.node h3{margin:0 0 4px}.badge{border:1px solid #4d6511;color:#b7e421;background:#172000;padding:4px 7px;border-radius:5px;font-size:10px;font-weight:800}.badge.bad{border-color:#7b392e;color:#ff8c73;background:#25100d}.badge.awg{border-color:#007b86;color:#22d3c5;background:#00272b}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.meta span{border:1px solid #2d3741;border-radius:4px;padding:4px 6px;color:#aeb8c4;font-size:11px}.protocols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.proto{border-top:1px solid #26303a;padding-top:10px}.proto b{display:block}.proto small{color:#7f8c9d}.node-actions{display:flex;justify-content:space-between;margin-top:16px}.error{color:#ff8c73;font-size:12px;margin-top:10px;overflow-wrap:anywhere}.empty{text-align:center;padding:50px;color:#8390a0}.login{max-width:390px;margin:18vh auto;padding:24px}.login input{display:block;width:100%;margin:10px 0}.toolbar{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;margin-bottom:12px}.table-wrap{overflow:auto;border:1px solid #26303a;border-radius:8px}table{width:100%;border-collapse:collapse;background:#0e1216;font-size:12px}th,td{padding:10px;border-bottom:1px solid #242b32;text-align:left;white-space:nowrap}th{color:#8190a2;font-size:10px;text-transform:uppercase}td strong{color:#fff}.peer-actions{display:flex;gap:5px}.peer-actions a{text-decoration:none}.checks{display:flex;align-items:center;gap:10px;color:#aeb8c4}.hidden{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:14px}.form,.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top h1{font-size:22px}}

/* 3WG Core light visual system */
:root{color:#131d2e;background:#edf3fc;font-family:"IBM Plex Mono","Roboto Mono",ui-monospace,monospace}body{background:#edf3fc;color:#131d2e}.shell{grid-template-columns:166px minmax(0,1fr)}.side{padding:0;background:#f8fafc;border-color:#ced9e8}.logo{width:164px;height:76px;margin:0;object-fit:contain}.brand{display:none}.sub{padding:10px 12px;border-top:1px dashed #cbd7e5;color:#6e819a;font-size:9px;text-transform:uppercase}.nav{margin-top:8px}.nav button{padding:10px 12px;color:#52677f;border-left-width:0;border-right:2px solid transparent;font-size:12px}.nav button.active{color:#628600;background:#e8f0dc;border-right-color:#87b800}.main{padding:10px 18px;background:#edf3fc}.top h1{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:25px;color:#111a2b}.top .muted{color:#71839a}.btn{background:#fff;color:#26374d;border-color:#c9d6e6;border-radius:6px;padding:7px 10px;font-size:11px}.btn.primary{background:#ff8c00;border-color:#ff8c00;color:#152033}.btn.danger{color:#df5363;border-color:#ffc2c8;background:#fff5f6}.stats{gap:8px;margin:10px 0 12px}.stat,.panel,.node{background:#fff;border-color:#d2ddec;border-radius:7px}.stat{min-height:58px;padding:10px 12px;position:relative;overflow:hidden}.stat:after,.node.online:after{content:"";position:absolute;width:110px;height:110px;right:-55px;top:-62px;background:#c8ff4b33;filter:blur(15px)}.stat b{font-size:18px;color:#6b9800}.stat span{color:#71839a;font-size:9px}.panel{padding:12px;margin-bottom:10px}.form{gap:6px}.form input,.form select,.toolbar input,.toolbar select{height:34px;background:#fff;color:#26374d;border-color:#c8d6e7;border-radius:6px;padding:7px 9px;font-size:11px}.checks{color:#52677f;font-size:11px}.grid{gap:10px}.node{padding:12px}.node h3{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:15px;color:#172235}.node a.muted{color:#58708e}.badge{background:#f3f8e8;border-color:#c5d99a;color:#648600}.badge.bad{background:#fff1f2;border-color:#fda4af;color:#be123c}.badge.awg{background:#ecfeff;border-color:#67e8f9;color:#0e7490}.meta{margin:10px 0}.meta span{border-color:#d3dfed;color:#647991;background:#f8fafc}.protocols{gap:8px}.proto{border-color:#dce5f0}.proto b{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:12px}.proto small{color:#70839a}.node-actions{margin-top:11px}.toolbar{gap:6px;margin-bottom:8px}.table-wrap{border-color:#d2ddec;background:#fff}table{background:#fff;color:#26374d;font-size:10px}th,td{padding:7px 8px;border-color:#e1e8f1}th{color:#71839a;font-size:8px}td strong{color:#172235}.empty{color:#71839a}.login{box-shadow:0 18px 60px #5f78902e}.login .brand{display:block;padding:0;color:#172235}.error{color:#c2410c}@media(max-width:900px){.shell{grid-template-columns:1fr}.main{padding:10px}}
</style>
<link rel="stylesheet" href="/core.css">
<style>
.hidden{display:none!important}.control-nav{display:grid;gap:2px}.control-nav .nav{cursor:pointer;text-align:left}.control-form{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;gap:8px}.control-form input,.control-form select,.control-toolbar input,.control-toolbar select{height:38px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:0 12px}.control-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}.control-node{position:relative;overflow:hidden}.control-node.online:after,.stat-card:after{content:"";position:absolute;width:120px;height:120px;right:-60px;top:-65px;background:var(--corner-glow);filter:blur(14px);pointer-events:none}.node-head,.node-actions{display:flex;justify-content:space-between;gap:12px}.node-head h3{margin:0 0 5px}.node-link{color:var(--muted);font-size:12px}.meta,.protocols,.peer-actions{display:flex;gap:7px;flex-wrap:wrap}.meta{margin:14px 0}.meta span{border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--muted);font-size:11px}.protocols{border-top:1px solid var(--line);padding-top:12px}.proto{flex:1;min-width:130px}.proto b,.proto small{display:block}.proto small{color:var(--muted);margin-top:4px}.node-actions{margin-top:16px}.control-toolbar{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;margin-bottom:10px}.table-wrap{overflow:auto}.control-table{min-width:1050px}.control-button{height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--text);padding:0 11px;text-decoration:none;cursor:pointer;font-weight:700}.control-button.danger{color:#be123c;border-color:#fecdd3}.control-button.small{height:29px;padding:0 8px;font-size:11px}.error{color:#c2410c;font-size:12px;margin-top:10px;overflow-wrap:anywhere}.empty{text-align:center;padding:42px;color:var(--muted)}@media(max-width:900px){.control-form,.control-toolbar{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.control-grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login-page hidden"><div class="login-card"><span class="badge">3WG CONTROL</span><img class="login-logo" src="/logo.png" alt="3WG"><p class="login-subtitle">Центральное управление VPN-нодами</p><label for="loginUser">Логин</label><input id="loginUser" value="admin"><label for="loginPass">Пароль</label><input id="loginPass" type="password"><button onclick="doLogin()">Войти</button><p id="loginError" class="login-error hidden"></p></div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="brand-block"><img src="/logo.png" alt="3WG"></div><div class="nav-title">УПРАВЛЕНИЕ ВСЕМИ НОДАМИ</div><div class="control-nav"><button id="navServers" class="nav active" onclick="showView('servers')">Серверы</button><button id="navPeers" class="nav" onclick="showView('peers')">Все пиры</button></div></aside><main class="main"><header class="topbar"><div><h1 id="pageTitle">Центр управления</h1><p>3WG Core и 3WG Easy Core</p></div><div class="top-actions"><button onclick="syncAll()">Обновить все</button><button onclick="logout()">Выйти</button></div></header>
<section class="stats-grid"><div class="stat-card"><div class="stat-value" id="sNodes">0</div><div class="stat-label">серверов</div></div><div class="stat-card"><div class="stat-value" id="sOnline">0</div><div class="stat-label">в сети</div></div><div class="stat-card"><div class="stat-value" id="sProtocols">0</div><div class="stat-label">протоколов</div></div><div class="stat-card"><div class="stat-value" id="sPeers">0</div><div class="stat-label">пиров</div></div></section>
<div id="serversView"><section class="card"><form class="control-form" onsubmit="addNode(event)" autocomplete="off"><input id="name" name="node_display_name" placeholder="Название ноды" autocomplete="off" required><input id="url" name="node_public_url" type="url" placeholder="https://vpn.example.com" autocomplete="off" required><input id="key" name="node_api_token" type="password" placeholder="Node API Key" autocomplete="new-password" required><input id="region" name="node_region" placeholder="Страна / город" autocomplete="off"><input id="tags" name="node_tags" placeholder="Теги через запятую" autocomplete="off"><button class="orange-btn small">Добавить</button></form><div id="formError" class="error"></div></section><section id="nodes" class="control-grid"></section></div>
<div id="peersView" class="hidden"><section class="card"><form class="control-form" onsubmit="createPeer(event)"><select id="peerNode" required></select><input id="peerName" placeholder="Имя клиента" required><div class="checks"><label><input id="peerWg" type="checkbox" checked> WireGuard</label><label><input id="peerAwg" type="checkbox" checked> AmneziaWG</label></div><select id="peerExpires"><option value="">Без срока</option><option value="30">30 дней</option><option value="180">Полгода</option><option value="365">1 год</option></select><input id="peerTraffic" type="number" min="0" placeholder="Лимит GiB"><button class="orange-btn small">Создать</button></form><div id="peerError" class="error"></div></section><div class="control-toolbar"><input id="peerSearch" placeholder="Поиск по имени, IP или серверу" oninput="renderPeers()"><select id="peerFilterNode" onchange="renderPeers()"><option value="">Все серверы</option></select><button class="control-button" onclick="renderPeers()">Обновить список</button></div><div class="card table-wrap"><table class="clients-table control-table"><thead><tr><th>Сервер</th><th>Имя</th><th>Протокол</th><th>IP</th><th>Статус</th><th>RX / TX</th><th>Действия</th></tr></thead><tbody id="peersBody"></tbody></table></div></div></main></div>
<script>
const $=id=>document.getElementById(id),loginEl=$('login'),appEl=$('app');
let stateData={nodes:[],summary:{nodes:0,online:0,protocols:0,peers:0}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.detail||`HTTP ${r.status}`);e.status=r.status;throw e}return d}
async function load(){try{const d=await api('/api/state');showApp();render(d)}catch(e){if(e.status===401)showLogin();else{showApp();$('nodes').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
function showLogin(){loginEl.classList.remove('hidden');appEl.classList.add('hidden')}function showApp(){loginEl.classList.add('hidden');appEl.classList.remove('hidden')}
async function doLogin(){$('loginError').textContent='';$('loginError').classList.add('hidden');try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginPass').value='';load()}catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden')}}
async function logout(){await api('/api/logout',{method:'POST'});showLogin()}
function render(d){stateData=d;$('sNodes').textContent=d.summary.nodes;$('sOnline').textContent=d.summary.online;$('sProtocols').textContent=d.summary.protocols;$('sPeers').textContent=d.summary.peers;$('nodes').innerHTML=d.nodes.length?d.nodes.map(nodeHtml).join(''):'<div class="card empty">Добавьте первую 3WG-ноду</div>';const options=d.nodes.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('');$('peerNode').innerHTML=options;$('peerFilterNode').innerHTML='<option value="">Все серверы</option>'+options;renderPeers()}
function showView(view){const peers=view==='peers';$('serversView').classList.toggle('hidden',peers);$('peersView').classList.toggle('hidden',!peers);$('navServers').classList.toggle('active',!peers);$('navPeers').classList.toggle('active',peers);$('pageTitle').textContent=peers?'Все пиры':'Центр управления'}
function nodeHtml(n){const s=n.snapshot||{},online=n.last_ok_at&&!n.last_error,protos=s.protocols||[],peers=s.peers||[];return `<article class="card control-node ${online?'online':''}"><div class="node-head"><div><h3>${esc(n.name)}</h3><a class="node-link" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a></div><span class="status-pill ${online?'online':'offline'}">${online?'ONLINE':'ERROR'}</span></div><div class="meta"><span>${esc((s.edition||'—').toUpperCase())}</span><span>${esc(s.version||'—')}</span>${n.region?`<span>${esc(n.region)}</span>`:''}<span>${peers.length} пиров</span></div><div class="protocols">${protos.map(p=>`<div class="proto"><b>${esc(p.title)}</b><small>${p.available?'доступен':'недоступен'} · ${esc(p.port||'—')}/udp</small></div>`).join('')||'<span class="muted">Нет данных</span>'}</div>${n.last_error?`<div class="error">${esc(n.last_error)}</div>`:''}<div class="node-actions"><button class="control-button" onclick="syncNode(${n.id})">Обновить</button><button class="control-button danger" onclick="removeNode(${n.id})">Удалить</button></div></article>`}
async function addNode(e){e.preventDefault();$('formError').textContent='';try{await api('/api/nodes',{method:'POST',body:JSON.stringify({name:$('name').value,url:$('url').value,api_key:$('key').value,region:$('region').value,tags:$('tags').value})});e.target.reset();load()}catch(x){$('formError').textContent=x.message}}
async function syncNode(id){await api(`/api/nodes/${id}/sync`,{method:'POST'});load()}async function syncAll(){await api('/api/sync',{method:'POST'});load()}async function removeNode(id){if(confirm('Удалить эту ноду из центра?')){await api(`/api/nodes/${id}`,{method:'DELETE'});load()}}
function bytes(v){v=Number(v||0);if(v<1024)return `${v} B`;const u=['KiB','MiB','GiB','TiB'];let i=-1;do{v/=1024;i++}while(v>=1024&&i<u.length-1);return `${v.toFixed(v>=10?1:2)} ${u[i]}`}
function allPeers(){return stateData.nodes.flatMap(n=>(n.snapshot.peers||[]).map(p=>({...p,nodeId:n.id,nodeName:n.name})))}
function renderPeers(){if(!$('peersBody'))return;const q=$('peerSearch').value.toLowerCase(),node=$('peerFilterNode').value;const peers=allPeers().filter(p=>(!node||String(p.nodeId)===node)&&(!q||`${p.name} ${p.ip_cidr} ${p.nodeName}`.toLowerCase().includes(q)));$('peersBody').innerHTML=peers.map(p=>`<tr><td>${esc(p.nodeName)}</td><td><strong>${esc(p.name)}</strong></td><td><span class="protocol-badge ${p.protocol==='amneziawg'?'awg':'wg'}">${esc(p.protocol_title||p.protocol)}</span></td><td><code>${esc(p.ip_cidr)}</code></td><td><span class="status-pill ${p.status==='active'?'online':'offline'}">${esc((p.status||'offline').toUpperCase())}</span></td><td>${bytes(p.live&&p.live.rx)} / ${bytes(p.live&&p.live.tx)}</td><td><div class="peer-actions"><a class="control-button small" title="Скачать .conf" href="/api/nodes/${p.nodeId}/peers/${p.id}/download/conf">CONF</a>${p.protocol==='amneziawg'?`<a class="control-button small" title="Скачать .vpn" href="/api/nodes/${p.nodeId}/peers/${p.id}/download/vpn">VPN</a>`:''}<button class="control-button small" onclick="peerAction(${p.nodeId},${p.id},'${p.enabled?'disable':'enable'}')">${p.enabled?'Отключить':'Включить'}</button><button class="control-button small" onclick="peerAction(${p.nodeId},${p.id},'traffic-reset')">Сброс</button><button class="control-button small danger" onclick="deletePeer(${p.nodeId},${p.id})">Удалить</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Пиры не найдены</td></tr>'}
async function createPeer(e){e.preventDefault();$('peerError').textContent='';const protocols=[];if($('peerWg').checked)protocols.push('wireguard');if($('peerAwg').checked)protocols.push('amneziawg');if(!protocols.length){$('peerError').textContent='Выберите хотя бы один протокол';return}const days=Number($('peerExpires').value||0),gib=Number($('peerTraffic').value||0);try{await api(`/api/nodes/${$('peerNode').value}/peers`,{method:'POST',body:JSON.stringify({name:$('peerName').value,protocols,expires_at:days?Math.floor(Date.now()/1000)+days*86400:null,traffic_limit_bytes:gib?gib*1073741824:0})});$('peerName').value='';await load();showView('peers')}catch(x){$('peerError').textContent=x.message}}
async function peerAction(node,id,action){try{await api(`/api/nodes/${node}/peers/${id}/${action}`,{method:'POST'});load()}catch(e){alert(e.message)}}async function deletePeer(node,id){if(!confirm('Удалить этот пир без возможности восстановления?'))return;try{await api(`/api/nodes/${node}/peers/${id}`,{method:'DELETE'});load()}catch(e){alert(e.message)}}
load();
</script></body></html>
