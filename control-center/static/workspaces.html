<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3WG — Клиенты</title><link rel="stylesheet" href="/core.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#edf3fc);color:var(--text,#172337)}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{background:var(--sidebar-bg,#f8fafc);border-right:1px solid var(--line,#d3dfed)}aside img{width:100%;height:90px;object-fit:contain}nav{display:grid;gap:4px;padding:16px}nav a{padding:10px;color:inherit;text-decoration:none}nav a.active{background:#e8f0dc;border-right:2px solid #83ad00}main{padding:20px;min-width:0}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0}h2{font-size:18px}button,input,select{font:inherit}button,a.button{padding:8px 12px;border:1px solid #cbd8e8;border-radius:6px;background:white;color:#172337;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}.primary{background:#ff9200;color:#152033;border-color:#ff9200}section{margin-top:20px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-size:12px}input,select{min-width:0;width:100%;padding:9px;border:1px solid #cbd8e8;border-radius:6px;background:#fff;color:#172337}.check{display:flex;align-items:center;gap:8px;margin:8px 0}.check input{width:auto}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:12px 8px;border-bottom:1px solid #d4dfed;text-align:left;vertical-align:middle}td:last-child{white-space:nowrap}th{font-size:11px;color:#71839b}.error{color:#a53025;overflow-wrap:anywhere}.muted{color:#71839b;font-size:12px}.notice{margin:16px 0;padding:10px;border:1px solid #d4dfed;border-radius:6px}.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}dialog{width:600px;max-width:calc(100vw - 24px);border:1px solid #cbd8e8;border-radius:8px;padding:20px}dialog::backdrop{background:#0006}.node-list{max-height:240px;overflow:auto;border-block:1px solid #d4dfed;margin-block:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){.workspace{grid-template-columns:1fr}aside img{width:140px;height:65px}nav{display:flex;padding:8px;flex-wrap:wrap}main{padding:12px}.fields{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body><div class="workspace"><aside><img src="/logo.png" alt="3WG"><nav><a id="centerLink" href="/">Центр управления</a><a class="active" href="/workspaces" id="spaceLink">Клиенты</a></nav></aside><main><header><div><h1 id="title">Клиенты</h1><p class="muted" id="subtitle"></p></div><div class="row"><button id="refresh">Обновить</button><button id="logout">Выйти</button></div></header><p id="error" class="error" role="alert"></p><div id="content"></div></main></div>
<dialog id="editor"><form id="tenantForm"><h2 id="editorTitle">Новый клиент</h2><div class="fields"><label>Название<input id="tenantName" required maxlength="100"></label><label>Логин<input id="tenantUser" required pattern="[A-Za-z0-9_.\-]{3,64}" autocomplete="off"></label><label>Пароль<input id="tenantPassword" type="password" minlength="12" maxlength="1024" autocomplete="new-password"></label></div><label class="check"><input id="tenantEnabled" type="checkbox" checked> Доступ включён</label><h3>Ноды клиента</h3><div id="assignments" class="node-list"></div><p id="editError" class="error" role="alert"></p><div class="toolbar"><button class="primary">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form></dialog>
<style>@media(max-width:700px){.workspace{grid-template-rows:auto 1fr;align-content:start}aside{align-self:start}}</style>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,tenants=[],editing=null,busy=false;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json'}});if(r.status===401){location.href='/';throw Error('Войдите заново')}const d=await r.json();if(!r.ok)throw Error(d.detail||'Ошибка запроса');return d}
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function load(){if(busy)return;setBusy(true);$('error').textContent='';try{state=await api('/api/state');if(state.role==='tenant'){renderEasy()}else{tenants=(await api('/api/tenants')).tenants;renderAdmin()}}catch(e){$('error').textContent=e.message}finally{setBusy(false)}}
function renderAdmin(){document.title='3WG Control — Клиенты';$('title').textContent='Клиенты';$('subtitle').textContent='Пространства и назначение нод';$('content').innerHTML=`<section><div class="row"><h2>Клиентские пространства · ${tenants.length}</h2><button class="primary" id="add">Создать клиента</button></div><div class="table-wrap"><table><thead><tr><th>Название</th><th>Логин</th><th>Состояние</th><th>Ноды</th><th></th></tr></thead><tbody>${tenants.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.username)}</td><td>${t.enabled?'Включён':'Отключён'}</td><td>${t.node_ids.map(id=>esc(state.nodes.find(n=>n.id===id)?.name||id)).join(', ')||'—'}</td><td><button data-edit="${t.id}">Редактировать</button></td></tr>`).join('')}</tbody></table></div></section>`;$('add').onclick=()=>edit(null);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)))}
function edit(id){editing=id;const t=tenants.find(t=>t.id===id);$('editorTitle').textContent=t?'Редактировать клиента':'Новый клиент';$('tenantName').value=t?.name||'';$('tenantUser').value=t?.username||'';$('tenantPassword').value='';$('tenantPassword').required=!t;$('tenantPassword').placeholder=t?'Оставить прежний':'';$('tenantEnabled').checked=t?!!t.enabled:true;$('editError').textContent='';$('assignments').innerHTML=state.nodes.map(n=>{const owner=tenants.find(v=>v.node_ids.includes(n.id));return `<label class="check"><input type="checkbox" value="${n.id}" ${t?.node_ids.includes(n.id)?'checked':''} ${owner&&owner.id!==id?'disabled':''}>${esc(n.name)}${owner&&owner.id!==id?' · занята':''}</label>`}).join('')||'<p class="muted">Ноды пока не добавлены</p>';$('editor').showModal()}
$('tenantForm').onsubmit=async e=>{e.preventDefault();setBusy(true);try{await api('/api/tenants'+(editing?'/'+editing:''),{method:editing?'PATCH':'POST',body:JSON.stringify({name:$('tenantName').value,username:$('tenantUser').value,password:$('tenantPassword').value,enabled:$('tenantEnabled').checked,node_ids:[...$('assignments').querySelectorAll('input:checked')].map(i=>Number(i.value))})});$('tenantPassword').value='';$('editor').close();setBusy(false);await load()}catch(e){$('editError').textContent=e.message}finally{setBusy(false)}};
function renderEasy(){document.title='3WG Easy Core';$('title').textContent='3WG Easy Core';$('subtitle').textContent=state.name;$('centerLink').hidden=true;$('spaceLink').textContent='Мои пиры';$('spaceLink').href='/easy';$('content').innerHTML=state.nodes.map(n=>`<section><div class="row"><h2>${esc(n.name)}</h2><button data-sync="${n.id}">Обновить ноду</button></div>${n.last_error?'<p class="error">Нет связи с нодой</p>':''}<form data-create="${n.id}" class="fields"><label>Имя пира<input name="name" required maxlength="100"></label><label>Протокол<select name="protocol"><option value="amneziawg">AmneziaWG</option><option value="wireguard">WireGuard</option></select></label><div class="toolbar"><button class="primary">Создать пира</button></div></form><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Протокол</th><th>IP</th><th></th></tr></thead><tbody>${(n.snapshot.peers||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.protocol_title||p.protocol)}</td><td>${esc(p.ip_cidr)}</td><td><a class="button" href="/api/nodes/${n.id}/peers/${p.id}/download/conf">.conf</a> ${p.protocol==='amneziawg'?`<a class="button" href="/api/nodes/${n.id}/peers/${p.id}/download/vpn">.vpn</a>`:''} <button data-action="disable" data-node="${n.id}" data-peer="${p.id}">Отключить</button> <button data-action="enable" data-node="${n.id}" data-peer="${p.id}">Включить</button></td></tr>`).join('')}</tbody></table></div></section>`).join('')||'<p class="notice">Администратор ещё не назначил ноды.</p>';document.querySelectorAll('[data-sync]').forEach(b=>b.onclick=()=>act(`/api/nodes/${b.dataset.sync}/sync`));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(`/api/nodes/${b.dataset.node}/peers/${b.dataset.peer}/${b.dataset.action}`));document.querySelectorAll('[data-create]').forEach(f=>f.onsubmit=e=>{e.preventDefault();act(`/api/nodes/${f.dataset.create}/peers`,{name:f.elements.name.value,protocols:[f.elements.protocol.value]})})}
async function act(path,payload={}){if(busy)return;setBusy(true);try{await api(path,{method:'POST',body:JSON.stringify(payload)});setBusy(false);await load()}catch(e){$('error').textContent=e.message}finally{setBusy(false)}}
$('cancel').onclick=()=>$('editor').close();$('refresh').onclick=load;$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
